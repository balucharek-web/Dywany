name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored from debug.keystore.base64 successfully"
        else
          echo "debug.keystore.base64 not found, fallback"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Prepare APK naming
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          TAG_NAME="v4.2.4"
        fi
        cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/EkspozycjaDywanow-${TAG_NAME}.apk"
        echo "APK_FILE=app/build/outputs/apk/debug/EkspozycjaDywanow-${TAG_NAME}.apk" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EkspozycjaDywanow-APK
        path: ${{ env.APK_FILE }}

    - name: Publish Release APK
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_FILE }}
        name: Ekspozycja Dywanów Leroy Merlin ${{ github.ref_name }} (APK)
        body: |
          Wydanie ${{ github.ref_name }} – Asystent Leroy Merlin, skanowanie kodów i okresowa aktualizacja danych.
          
          Główne zmiany:
          - Skanowanie etykiet z automatycznym rozpoznawaniem kodu EAN oraz 8-cyfrowego numeru LM.
          - Wyszukiwanie danych na oficjalnej stronie Leroy Merlin aktywne wyłącznie podczas dodawania dywanu (brak szukania po miejscu regału).
          - Okresowa aktualizacja cen i danych powieszonych dywanów w sklepie.
          - Naprawa uprawnień Firestore (brak błędów PERMISSION_DENIED przy starcie).
          - Bezpośredni plik instalacyjny APK: EkspozycjaDywanow-${{ github.ref_name }}.apk
