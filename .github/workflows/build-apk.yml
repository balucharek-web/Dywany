name: Budowanie i Aktualizacja APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Zbuduj aplikację Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy
        uses: actions/checkout@v4

      - name: Skonfiguruj Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Zbuduj plik APK (Debug)
        run: gradle assembleDebug --stacktrace

      - name: Prześlij plik APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Dywany-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Utwórz lub zaktualizuj Wydanie (GitHub Release)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: DywanMag - Najnowszy plik instalacyjny APK
          body: |
            ### 📱 Aplikacja DywanMag
            Najnowsza wersja aplikacji do zarządzania ekspozycją dywanów na stojakach:
            - Stojaki (magazyny) z miejscami A i B (1a, 23b).
            - Wyszukiwanie miejsc, kodów ESL, EAN oraz nazw produktów.
            - Skaner kodów kreskowych i etykiet ESL.
            - Baza danych w czasie rzeczywistym (edycja dla zalogowanych użytkowników Google).
            - Automatyczne pobieranie danych dywanów ze strony leroymerlin.pl (nazwa, cena, referencja, zdjęcie).

            **Pobierz i zaktualizuj aplikację na telefonie:**
            Pobierz poniższy plik **`app-debug.apk`** i zainstaluj na swoim urządzeniu.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
