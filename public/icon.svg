<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant green gradient matching Android screenshot icon -->
    <linearGradient id="greenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Green rounded square background -->
  <rect width="512" height="512" rx="120" fill="url(#greenBg)"/>

  <!-- White Carpet Exhibition Rack / Stojak z dywanem -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Horizontal Crossbar (pałąk) -->
    <line x1="86" y1="110" x2="426" y2="110" stroke-width="26"/>
    <!-- Left vertical post -->
    <line x1="120" y1="110" x2="120" y2="430" stroke-width="24"/>
    <!-- Right vertical post -->
    <line x1="392" y1="110" x2="392" y2="430" stroke-width="24"/>
    <!-- Left foot base -->
    <line x1="86" y1="430" x2="154" y2="430" stroke-width="24"/>
    <!-- Right foot base -->
    <line x1="358" y1="430" x2="426" y2="430" stroke-width="24"/>

    <!-- Hanging clips / rings -->
    <line x1="176" y1="110" x2="176" y2="140" stroke-width="12"/>
    <line x1="256" y1="110" x2="256" y2="140" stroke-width="12"/>
    <line x1="336" y1="110" x2="336" y2="140" stroke-width="12"/>

    <!-- Hanging Main Carpet -->
    <!-- Carpet Body -->
    <rect x="156" y="140" width="200" height="230" rx="14" fill="#ffffff" fill-opacity="0.15" stroke-width="20"/>

    <!-- Inner decorative border of the carpet -->
    <rect x="184" y="168" width="144" height="174" rx="8" stroke-width="12"/>

    <!-- Center ornamental motif on carpet -->
    <circle cx="256" cy="255" r="26" stroke-width="12"/>

    <!-- Bottom fringes / frędzle dywanu -->
    <line x1="172" y1="370" x2="172" y2="396" stroke-width="10"/>
    <line x1="196" y1="370" x2="196" y2="396" stroke-width="10"/>
    <line x1="220" y1="370" x2="220" y2="396" stroke-width="10"/>
    <line x1="244" y1="370" x2="244" y2="396" stroke-width="10"/>
    <line x1="268" y1="370" x2="268" y2="396" stroke-width="10"/>
    <line x1="292" y1="370" x2="292" y2="396" stroke-width="10"/>
    <line x1="316" y1="370" x2="316" y2="396" stroke-width="10"/>
    <line x1="340" y1="370" x2="340" y2="396" stroke-width="10"/>
  </g>
</svg>
