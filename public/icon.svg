<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Carpet roll / exposition base badge -->
  <rect x="76" y="380" width="360" height="48" rx="24" fill="#3b82f6"/>
  <text x="256" y="413" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">SKLEP 038</text>

  <!-- Leroy Merlin Triangle -->
  <!-- Apex at (256, 90), left base (96, 330), right base (416, 330) -->
  <polygon points="256,90 416,330 96,330" fill="url(#greenGrad)"/>

  <!-- White House cutout inside triangle -->
  <polygon points="256,170 340,250 340,330 172,330 172,250" fill="#ffffff"/>

  <!-- Inner roof divider line -->
  <line x1="256" y1="170" x2="340" y2="250" stroke="#78be20" stroke-width="10"/>
  <line x1="256" y1="170" x2="172" y2="250" stroke="#78be20" stroke-width="10"/>

  <!-- Text "DYWANY" in white house -->
  <text x="256" y="305" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2">DYWANY</text>
</svg>
