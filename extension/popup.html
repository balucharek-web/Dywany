<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      width: 340px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .logo-badge {
      background: #1d4ed8;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }
    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    .search-input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2);
    }
    .btn-full {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      background: #1d4ed8;
      color: white;
      padding: 9px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
    .btn-full:hover {
      background: #1e40af;
    }
    .info-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: #475569;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex; align-items:center; gap:6px;">
      <span class="logo-badge">DywanMag</span>
      <span style="font-size: 12px; font-weight: bold;">Ekspozycja</span>
    </div>
    <span style="font-size: 10px; color:#16a34a; font-weight:bold;">● Online</span>
  </div>

  <input type="text" id="popupSearch" class="search-input" placeholder="Szukaj miejsca (np. 1a, 23b), ESL, EAN...">

  <div class="info-card">
    <b>Wskazówka:</b> Będąc na karcie produktu na <code>leroymerlin.pl</code>, zobaczysz na stronie przycisk <b>„📌 Przypisz do stojaka”</b>, który jednym kliknięciem przenosi dywan do Twojej bazy.
  </div>

  <a href="https://balucharek-web.github.io/Dywany/" target="_blank" class="btn-full">
    Otwórz pełny panel w nowej karcie ↗
  </a>

  <script src="popup.js"></script>
</body>
</html>
