<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leroy Merlin – System Ekspozycji Dywanów</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --leroy-green: #008037;
      --leroy-light-green: #78BE20;
    }
    .bg-leroy { background-color: var(--leroy-green); }
    .text-leroy { color: var(--leroy-green); }
    .border-leroy { border-color: var(--leroy-green); }
    .bg-leroy-accent { background-color: var(--leroy-light-green); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <!-- Firebase Modular Scripts via ESM in Babel -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      onSnapshot, 
      setDoc, 
      updateDoc, 
      deleteDoc, 
      writeBatch, 
      serverTimestamp, 
      getDoc, 
      getDocs,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getFunctions,
      httpsCallable
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    // Konfiguracja Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAGHiZoM8jzB5lkTJlU9c07mHAu2sheQKI",
      authDomain: "com-aistudio-rugdisplay-d297d.firebaseapp.com",
      projectId: "com-aistudio-rugdisplay-d297d",
      storageBucket: "com-aistudio-rugdisplay-d297d.firebasestorage.app",
      appId: "1:68898764483:web:rugdisplay-web-app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const DATABASE_ID = "ai-studio-android-ekspozyc-1a74d62b-b3ae-4eeb-8cc7-c35020e9f415";
    const db = getFirestore(app, DATABASE_ID);
    const functions = getFunctions(app);

    const SUPER_ADMIN_EMAIL = "abaluch@leroymerlin.pl";

    function App() {
      const [user, setUser] = React.useState(null);
      const [role, setRole] = React.useState("USER");
      const [palki, setPalki] = React.useState([]);
      const [admins, setAdmins] = React.useState([]);
      const [history, setHistory] = React.useState([]);
      const [searchQuery, setSearchQuery] = React.useState("");
      const [filter, setFilter] = React.useState("ALL"); // ALL, OCCUPIED, EMPTY
      const [loading, setLoading] = React.useState(true);
      const [busy, setBusy] = React.useState(false);
      const [toast, setToast] = React.useState(null);

      // Modale
      const [assignModal, setAssignModal] = React.useState(null); // { palekNumer, slotKey, initialSlot }
      const [swapModal, setSwapModal] = React.useState(null); // { fromPalek, fromSlot }
      const [deleteModal, setDeleteModal] = React.useState(null); // palek
      const [adminModal, setAdminModal] = React.useState(false);
      const [historyModal, setHistoryModal] = React.useState(false);
      const [addPalekModal, setAddPalekModal] = React.useState(false);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // 1. Obserwacja stanu uwierzytelnienia
      React.useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // 2. Obserwacja roli użytkownika
      React.useEffect(() => {
        if (!user) {
          setRole("USER");
          return;
        }
        const userEmail = (user.email || "").toLowerCase();
        if (userEmail === SUPER_ADMIN_EMAIL) {
          setRole("SUPER_ADMIN");
          return;
        }

        const adminDocRef = doc(db, "admins", userEmail);
        const unsubscribe = onSnapshot(adminDocRef, (snap) => {
          if (snap.exists()) {
            setRole("ADMIN");
          } else {
            setRole("USER");
          }
        });
        return () => unsubscribe();
      }, [user]);

      // 3. Obserwacja pałąków w czasie rzeczywistym
      React.useEffect(() => {
        if (!user) return;
        const palkiRef = collection(db, "palki");
        const unsubscribe = onSnapshot(palkiRef, (snapshot) => {
          const list = [];
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            list.push({
              id: docSnap.id,
              numer: data.numer || 0,
              slots: data.slots || { A: null, B: null }
            });
          });
          list.sort((a, b) => a.numer - b.numer);
          setPalki(list);
        }, (err) => {
          console.error("Błąd odczytu pałąków:", err);
        });
        return () => unsubscribe();
      }, [user]);

      // 4. Obserwacja administratorów (dla Super Admina)
      React.useEffect(() => {
        if (!user || role !== "SUPER_ADMIN") return;
        const adminsRef = collection(db, "admins");
        const unsubscribe = onSnapshot(adminsRef, (snapshot) => {
          const list = [];
          snapshot.forEach((docSnap) => {
            list.push({ email: docSnap.id, ...docSnap.data() });
          });
          setAdmins(list);
        });
        return () => unsubscribe();
      }, [user, role]);

      // 5. Obserwacja historii zmian
      React.useEffect(() => {
        if (!user) return;
        const histRef = collection(db, "history");
        const unsubscribe = onSnapshot(histRef, (snapshot) => {
          const list = [];
          snapshot.forEach((docSnap) => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });
          list.sort((a, b) => (b.id || "").localeCompare(a.id || ""));
          setHistory(list);
        });
        return () => unsubscribe();
      }, [user]);

      // Logowanie Google
      const handleGoogleLogin = async () => {
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (err) {
          console.error("Błąd logowania:", err);
          showToast("Nie udało się zalogować: " + err.message, "error");
        }
      };

      const handleLogout = async () => {
        try {
          await signOut(auth);
        } catch (err) {
          console.error("Błąd wylogowania:", err);
        }
      };

      // Bezpieczne pobieranie danych produktu z backendu Cloud Functions i pamięci Firestore
      const handleFetchProductData = async (identifier) => {
        const clean = identifier.trim();
        if (!clean) return null;

        // 1. Sprawdź pamięć podręczną Firestore
        try {
          if (/^[0-9]{8}$/.test(clean)) {
            const docSnap = await getDoc(doc(db, "dywany", clean));
            if (docSnap.exists() && docSnap.data().nazwa) {
              return docSnap.data();
            }
          } else if (/^[0-9]{12,14}$/.test(clean)) {
            const q = query(collection(db, "dywany"), where("ean", "==", clean));
            const snap = await getDocs(q);
            if (!snap.empty) {
              return snap.docs[0].data();
            }
          }
        } catch (cacheErr) {
          console.warn("Błąd sprawdzania cache Firestore:", cacheErr);
        }

        // 2. Bezpieczna warstwa backendowa: Firebase Cloud Functions
        try {
          const fetchProductFn = httpsCallable(functions, "fetchProductData");
          const result = await fetchProductFn({ identifier: clean });
          if (result && result.data) {
            return result.data;
          }
        } catch (fnErr) {
          console.warn("Błąd wywołania Cloud Functions (używam fallbacku):", fnErr);
        }

        // 3. Fallback: jeżeli produkt nie został odnaleziony lub funkcja jest niedostępna
        return {
          km: /^[0-9]{8}$/.test(clean) ? clean : "",
          ean: /^[0-9]{12,14}$/.test(clean) ? clean : "",
          nazwa: "",
          rozmiar: "",
          cena: null,
          waluta: "PLN",
          productUrl: "",
          status: "NOT_FOUND"
        };
      };

      // Dodawanie pałąka
      const handleAddPalek = async (customNum) => {
        try {
          setBusy(true);
          const nextNum = customNum ? parseInt(customNum, 10) : (palki.length > 0 ? Math.max(...palki.map(p => p.numer)) + 1 : 1);
          const palekId = `palek_${nextNum}`;
          await setDoc(doc(db, "palki", palekId), {
            id: palekId,
            numer: nextNum,
            createdAt: serverTimestamp(),
            createdBy: user.email,
            slots: { A: null, B: null }
          });
          await logAction("CREATE_PALEK", "", "", `Pałąk ${nextNum}`, `Utworzono pałąk ${nextNum}`);
          showToast(`Dodano pałąk ${nextNum}`);
          setAddPalekModal(false);
        } catch (err) {
          showToast("Błąd dodawania pałąka: " + err.message, "error");
        } finally {
          setBusy(false);
        }
      };

      // Usuwanie pałąka
      const handleDeletePalek = async (palek) => {
        try {
          setBusy(true);
          const batch = writeBatch(db);
          if (palek.slots?.A?.km) batch.delete(doc(db, "dywany", palek.slots.A.km));
          if (palek.slots?.B?.km) batch.delete(doc(db, "dywany", palek.slots.B.km));
          batch.delete(doc(db, "palki", palek.id));
          await batch.commit();

          await logAction("DELETE_PALEK", "", `Pałąk ${palek.numer}`, "", `Usunięto pałąk ${palek.numer}`);
          showToast(`Usunięto pałąk ${palek.numer}`);
          setDeleteModal(null);
        } catch (err) {
          showToast("Błąd usuwania pałąka: " + err.message, "error");
        } finally {
          setBusy(false);
        }
      };

      // Przypisanie dywanu (8-cyfrowy KM + metadane Leroy Merlin)
      const handleAssignRug = async (palekNumer, slotKey, data) => {
        try {
          const km = (data.km || "").trim();
          if (!/^[0-9]{8}$/.test(km)) {
            showToast("Numer KM musi mieć dokładnie 8 cyfr!", "error");
            return;
          }
          setBusy(true);
          const cleanSlot = slotKey.toUpperCase();
          const miejsce = `${palekNumer}${cleanSlot}`;
          const palekId = `palek_${palekNumer}`;

          const slotPayload = {
            km: km,
            ean: (data.ean || "").trim(),
            nazwa: (data.nazwa || "").trim(),
            rozmiar: (data.rozmiar || "").trim(),
            cena: data.cena !== null && data.cena !== undefined ? parseFloat(data.cena) : null,
            waluta: data.waluta || "PLN",
            productUrl: (data.productUrl || "").trim(),
            productDataStatus: "ACTIVE",
            productDataUpdatedAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            updatedByEmail: user.email
          };

          const batch = writeBatch(db);
          batch.update(doc(db, "palki", palekId), {
            [`slots.${cleanSlot}`]: slotPayload
          });
          batch.set(doc(db, "dywany", km), {
            ...slotPayload,
            palekNumer,
            miejsce,
            slot: cleanSlot,
            productDataSource: "leroy_merlin"
          }, { merge: true });

          // Zapisz w historii cen jeśli podano cenę
          if (slotPayload.cena !== null && !isNaN(slotPayload.cena)) {
            const priceLogId = `${Date.now()}_price_${km}`;
            batch.set(doc(db, "productPriceHistory", priceLogId), {
              id: priceLogId,
              km: km,
              newPrice: slotPayload.cena,
              changedAt: serverTimestamp(),
              source: "leroy_merlin",
              changedBy: user.email
            });
          }

          await batch.commit();
          await logAction("ADD", km, "", miejsce, `Przypisano dywan ${km} do ${miejsce} (${slotPayload.nazwa}) - ${slotPayload.cena || ""} zł`);
          showToast(`Zapisano dywan ${km} na ${miejsce}`);
          setAssignModal(null);
        } catch (err) {
          showToast("Błąd zapisu dywanu: " + err.message, "error");
        } finally {
          setBusy(false);
        }
      };

      // Odświeżenie danych produktu przez administratora
      const handleRefreshProduct = async (km) => {
        try {
          setBusy(true);
          const docSnap = await getDoc(doc(db, "dywany", km));
          if (!docSnap.exists()) {
            showToast("Nie znaleziono produktu w bazie", "error");
            return;
          }
          // Zaktualizuj timestamp odświeżenia
          await updateDoc(doc(db, "dywany", km), {
            productDataUpdatedAt: serverTimestamp(),
            productDataStatus: "ACTIVE"
          });
          await logAction("UPDATE_PRODUCT", km, "", "", `Odświeżono dane produktu ${km}`);
          showToast(`Dane produktu ${km} zostały zaktualizowane`);
        } catch (err) {
          showToast("Błąd odświeżania: " + err.message, "error");
        } finally {
          setBusy(false);
        }
      };

      // Usunięcie dywanu ze slotu
      const handleRemoveRug = async (palekNumer, slotKey) => {
        try {
          setBusy(true);
          const cleanSlot = slotKey.toUpperCase();
          const palekId = `palek_${palekNumer}`;
          const miejsce = `${palekNumer}${cleanSlot}`;

          const palekDoc = await getDoc(doc(db, "palki", palekId));
          const currentKm = palekDoc.data()?.slots?.[cleanSlot]?.km || "";

          const batch = writeBatch(db);
          batch.update(doc(db, "palki", palekId), { [`slots.${cleanSlot}`]: null });
          if (currentKm) {
            batch.delete(doc(db, "dywany", currentKm));
          }
          await batch.commit();

          await logAction("REMOVE", currentKm, miejsce, "PUSTE", `Zwolniono miejsce ${miejsce}`);
          showToast(`Zwolniono miejsce ${miejsce}`);
          setAssignModal(null);
        } catch (err) {
          showToast("Błąd zwalniania miejsca: " + err.message, "error");
        } finally {
          setBusy(false);
        }
      };

      // Zamiana lub przeniesienie
      const handleSwapOrMove = async (fromPalek, fromSlot, toPalek, toSlot) => {
        try {
          const fSlot = fromSlot.toUpperCase();
          const tSlot = toSlot.toUpperCase();
          const fromPlace = `${fromPalek}${fSlot}`;
          const toPlace = `${toPalek}${tSlot}`;
          if (fromPlace === toPlace) return;

          setBusy(true);
          const fromPalekId = `palek_${fromPalek}`;
          const toPalekId = `palek_${toPalek}`;

          const fromSnap = await getDoc(doc(db, "palki", fromPalekId));
          const toSnap = fromPalekId === toPalekId ? fromSnap : await getDoc(doc(db, "palki", toPalekId));

          const sourceSlotData = fromSnap.data()?.slots?.[fSlot];
          const targetSlotData = toSnap.data()?.slots?.[tSlot];

          if (!sourceSlotData?.km) {
            showToast(`Miejsce ${fromPlace} jest puste!`, "error");
            return;
          }

          const isSwap = !!targetSlotData?.km;
          const batch = writeBatch(db);

          batch.update(doc(db, "palki", toPalekId), {
            [`slots.${tSlot}`]: {
              ...sourceSlotData,
              updatedAt: serverTimestamp(),
              updatedByEmail: user.email
            }
          });

          batch.update(doc(db, "palki", fromPalekId), {
            [`slots.${fSlot}`]: isSwap ? {
              ...targetSlotData,
              updatedAt: serverTimestamp(),
              updatedByEmail: user.email
            } : null
          });

          batch.set(doc(db, "dywany", sourceSlotData.km), {
            palekNumer: toPalek,
            miejsce: toPlace,
            slot: tSlot,
            updatedAt: serverTimestamp(),
            updatedByEmail: user.email
          }, { merge: true });

          if (isSwap) {
            batch.set(doc(db, "dywany", targetSlotData.km), {
              palekNumer: fromPalek,
              miejsce: fromPlace,
              slot: fSlot,
              updatedAt: serverTimestamp(),
              updatedByEmail: user.email
            }, { merge: true });
          }

          await batch.commit();

          const actionType = isSwap ? "SWAP" : "MOVE";
          const details = isSwap 
            ? `Zamieniono dywany: ${sourceSlotData.km} (${fromPlace} ↔ ${toPlace}) oraz ${targetSlotData.km}`
            : `Przeniesiono dywan ${sourceSlotData.km} z ${fromPlace} na ${toPlace}`;

          await logAction(actionType, sourceSlotData.km, fromPlace, toPlace, details);
          showToast(`Wykonano: ${fromPlace} → ${toPlace}`);
          setSwapModal(null);
        } catch (err) {
          showToast("Błąd zamiany/przeniesienia: " + err.message, "error");
        } finally {
          setBusy(false);
        }
      };

      const handleAddAdmin = async (email) => {
        try {
          const cleanEmail = email.trim().toLowerCase();
          if (!cleanEmail.includes("@")) return;
          await setDoc(doc(db, "admins", cleanEmail), {
            email: cleanEmail,
            addedBy: user.email,
            createdAt: serverTimestamp()
          });
          await logAction("ADD_ADMIN", "", "", cleanEmail, `Nadano uprawnienia administratora dla ${cleanEmail}`);
          showToast(`Dodano administratora: ${cleanEmail}`);
        } catch (err) {
          showToast("Błąd dodawania admina: " + err.message, "error");
        }
      };

      const handleRemoveAdmin = async (email) => {
        try {
          await deleteDoc(doc(db, "admins", email));
          await logAction("REMOVE_ADMIN", "", email, "", `Odebrano uprawnienia administratora dla ${email}`);
          showToast(`Usunięto administratora: ${email}`);
        } catch (err) {
          showToast("Błąd usuwania admina: " + err.message, "error");
        }
      };

      const logAction = async (action, km, from, to, details) => {
        try {
          const logId = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
          await setDoc(doc(db, "history", logId), {
            id: logId,
            action,
            km,
            from,
            to,
            details,
            userEmail: user.email,
            userName: user.displayName || user.email,
            timestamp: serverTimestamp()
          });
        } catch (err) {
          console.error("Błąd zapisu historii:", err);
        }
      };

      // Filtrowanie listy pałąków
      const filteredPalki = React.useMemo(() => {
        const query = searchQuery.trim().toUpperCase();
        return palki.filter((p) => {
          const isOccA = !!p.slots?.A?.km;
          const isOccB = !!p.slots?.B?.km;
          const hasAny = isOccA || isOccB;
          const isEmpty = !hasAny;

          if (filter === "OCCUPIED" && !hasAny) return false;
          if (filter === "EMPTY" && !isEmpty) return false;

          if (!query) return true;

          // 1. Numer KM
          if (p.slots?.A?.km === query || p.slots?.B?.km === query) return true;

          // 2. Kod EAN
          if (p.slots?.A?.ean === query || p.slots?.B?.ean === query) return true;

          // 3. Miejsce (np. 23A lub 1B)
          if (/^[1-9][0-9]*[AB]$/.test(query)) {
            const num = parseInt(query.slice(0, -1), 10);
            return p.numer === num;
          }

          // 4. Numer pałąka
          if (p.numer.toString() === query) return true;

          // 5. Nazwa dywanu
          if (p.slots?.A?.nazwa?.toUpperCase().includes(query) || p.slots?.B?.nazwa?.toUpperCase().includes(query)) return true;

          return false;
        });
      }, [palki, searchQuery, filter]);

      // Statystyki
      const stats = React.useMemo(() => {
        const total = palki.length;
        const totalSlots = total * 2;
        let occupied = 0;
        palki.forEach((p) => {
          if (p.slots?.A?.km) occupied++;
          if (p.slots?.B?.km) occupied++;
        });
        return {
          total,
          totalSlots,
          occupied,
          empty: Math.max(0, totalSlots - occupied)
        };
      }, [palki]);

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-50">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-slate-600 font-medium">Ładowanie systemu ekspozycji...</p>
            </div>
          </div>
        );
      }

      // Widok niezalogowanego
      if (!user) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-emerald-800 via-emerald-900 to-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full text-center">
              <div className="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
              </div>
              <span className="text-xs font-black tracking-widest text-emerald-600 uppercase">Leroy Merlin</span>
              <h1 className="text-2xl font-black text-slate-900 mt-1 mb-3">System Ekspozycji Dywanów</h1>
              <p className="text-sm text-slate-500 mb-8">
                Aplikacja sklepu do zarządzania pałąkami i lokalizacją dywanów z automatycznym pobieraniem cen i danych Leroy Merlin.
              </p>
              <button
                onClick={handleGoogleLogin}
                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-3 shadow-lg shadow-emerald-600/30 active:scale-95"
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />

          )}

        </div>
      );
    }

    // Modal dodawania / edycji z pobieraniem danych Leroy Merlin
    function AssignModalDialog({ modalData, onClose, onFetchProduct, onSave, onRemove }) {
      const initial = modalData.initialSlot || {};
      const [lookupId, setLookupId] = React.useState(initial.ean || initial.km || "");
      const [km, setKm] = React.useState(initial.km || "");
      const [ean, setEan] = React.useState(initial.ean || "");
      const [nazwa, setNazwa] = React.useState(initial.nazwa || "");
      const [rozmiar, setRozmiar] = React.useState(initial.rozmiar || "");
      const [cena, setCena] = React.useState(initial.cena !== undefined && initial.cena !== null ? initial.cena : "");
      const [productUrl, setProductUrl] = React.useState(initial.productUrl || "");
      const [isFetching, setIsFetching] = React.useState(false);
      const [fetchStatus, setFetchStatus] = React.useState(null);
      const [fetchResult, setFetchResult] = React.useState(null);

      const handleLookup = async () => {
        const clean = lookupId.trim();
        if (!clean) return;
        setIsFetching(true);
        setFetchStatus(null);
        setFetchResult(null);

        try {
          const res = await onFetchProduct(clean);
          setIsFetching(false);
          if (res && (res.nazwa || res.status === "ACTIVE")) {
            setFetchStatus("FOUND");
            setFetchResult(res);
            if (res.km) setKm(res.km);
            if (res.ean) setEan(res.ean);
            if (res.nazwa) setNazwa(res.nazwa);
            if (res.rozmiar) setRozmiar(res.rozmiar);
            if (res.cena !== null && res.cena !== undefined) setCena(res.cena);
            if (res.productUrl) setProductUrl(res.productUrl);
          } else if (res && res.status === "NOT_FOUND") {
            setFetchStatus("NOT_FOUND");
            if (/^[0-9]{8}$/.test(clean)) setKm(clean);
          } else {
            setFetchStatus("ERROR");
            if (/^[0-9]{8}$/.test(clean)) setKm(clean);
          }
        } catch (e) {
          setIsFetching(false);
          setFetchStatus("ERROR");
          if (/^[0-9]{8}$/.test(clean)) setKm(clean);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 className="text-lg font-black text-slate-900 mb-1">
              {initial.km ? "Edycja dywanu" : "Dodaj dywan do ekspozycji"}
            </h3>
            <p className="text-xs text-slate-500 mb-4">
              Miejsce: <strong className="text-emerald-700 text-sm">{modalData.palekNumer}{modalData.slotKey}</strong>
            </p>

            {/* Panel pobierania danych */}
            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-4">
              <label className="block text-[11px] font-black uppercase text-emerald-800 tracking-wider mb-1.5">
                EAN lub numer produktu Leroy Merlin
              </label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={lookupId}
                  onChange={(e) => setLookupId(e.target.value)}
                  placeholder="np. 5901234567890 lub 12345678"
                  className="flex-1 bg-white border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                />
                <button
                  type="button"
                  onClick={handleLookup}
                  disabled={isFetching || !lookupId.trim()}
                  className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow-sm"
                >
                  {isFetching ? "Pobieranie..." : "POBIERZ DANE PRODUKTU"}
                </button>
              </div>

              {fetchStatus === "FOUND" && (
                <div className="mt-3 p-3 bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs rounded-xl space-y-1">
                  <div className="flex items-center gap-1.5 font-bold text-emerald-800">
                    <span>✓</span>
                    <span>Produkt odnaleziony w katalogu Leroy Merlin!</span>
                  </div>
                  {fetchResult && (
                    <div className="text-[11px] text-slate-600 pt-1 space-y-0.5">
                      <div><strong>Nazwa:</strong> {fetchResult.nazwa || "brak"}</div>
                      {fetchResult.rozmiar && <div><strong>Rozmiar:</strong> {fetchResult.rozmiar}</div>}
                      {fetchResult.cena && <div><strong>Cena:</strong> {fetchResult.cena} zł</div>}
                      {fetchResult.km && <div><strong>Numer Leroy Merlin:</strong> {fetchResult.km}</div>}
                      {fetchResult.ean && <div><strong>EAN:</strong> {fetchResult.ean}</div>}
                      {fetchResult.productUrl && (
                        <div className="truncate">
                          <strong>URL:</strong> <a href={fetchResult.productUrl} target="_blank" rel="noreferrer" className="text-emerald-700 underline">{fetchResult.productUrl}</a>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
              {fetchStatus === "NOT_FOUND" && (
                <div className="mt-2.5 p-2.5 bg-amber-50 text-amber-800 text-xs rounded-xl border border-amber-200">
                  ⚠️ Nie znaleziono produktu o tym numerze. Wprowadź dane dywanu ręcznie.
                </div>
              )}
              {fetchStatus === "ERROR" && (
                <div className="mt-2.5 p-2.5 bg-red-50 text-red-800 text-xs rounded-xl border border-red-200">
                  ⚠️ Błąd pobierania danych ze strony Leroy Merlin. Wprowadź dane produktu ręcznie.
                </div>
              )}
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSave({
                  km,
                  ean,
                  nazwa,
                  rozmiar,
                  cena: cena ? parseFloat(cena) : null,
                  productUrl: productUrl.trim()
                });
              }}
              className="space-y-3.5"
            >
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Numer KM (8 cyfr) *</label>
                <input
                  type="text"
                  required
                  maxLength={8}
                  pattern="[0-9]{8}"
                  value={km}
                  onChange={(e) => setKm(e.target.value.replace(/\D/g, "").slice(0, 8))}
                  placeholder="np. 45657894"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-mono tracking-wider focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kod EAN</label>
                <input
                  type="text"
                  value={ean}
                  onChange={(e) => setEan(e.target.value)}
                  placeholder="np. 5901234567890"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nazwa dywanu *</label>
                <input
                  type="text"
                  required
                  value={nazwa}
                  onChange={(e) => setNazwa(e.target.value)}
                  placeholder="np. Dywan nowoczesny BERBER"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Rozmiar</label>
                  <input
                    type="text"
                    value={rozmiar}
                    onChange={(e) => setRozmiar(e.target.value)}
                    placeholder="np. 160 x 230 cm"
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Cena (zł)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={cena}
                    onChange={(e) => setCena(e.target.value)}
                    placeholder="399.99"
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">URL produktu Leroy Merlin</label>
                <input
                  type="url"
                  value={productUrl}
                  onChange={(e) => setProductUrl(e.target.value)}
                  placeholder="https://www.leroymerlin.pl/..."
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                />
              </div>

              <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                {initial.km && (
                  <button
                    type="button"
                    onClick={onRemove}
                    className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-bold transition mr-auto"
                  >
                    Zwolnij miejsce
                  </button>
                )}
                <button
                  type="button"
                  onClick={onClose}
                  className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition"
                >
                  Anuluj
                </button>
                <button
                  type="submit"
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20"
                >
                  {initial.km ? "Zapisz zmiany" : "DODAJ DYWAN"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Komponent Karty Pałąka
    function PalekCard({ palek, role, highlight, onAssign, onSwap, onRefreshProduct, onDelete }) {
      const isFull = palek.slots?.A?.km && palek.slots?.B?.km;
      const isEmpty = !palek.slots?.A?.km && !palek.slots?.B?.km;
      const canEdit = role === "ADMIN" || role === "SUPER_ADMIN";

      return (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div className="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-100">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-emerald-700 text-white flex items-center justify-center font-black text-sm">
                  {palek.numer}
                </div>
                <div>
                  <h4 className="text-sm font-black text-slate-800">PAŁĄK {palek.numer}</h4>
                  <span className={`text-[10px] font-bold ${
                    isFull ? "text-emerald-600" : isEmpty ? "text-slate-400" : "text-amber-600"
                  }`}>
                    {isFull ? "Pełny (2/2)" : isEmpty ? "Pusty (0/2)" : "Częściowy (1/2)"}
                  </span>
                </div>
              </div>

              {canEdit && (
                <button
                  onClick={onDelete}
                  className="text-slate-300 hover:text-red-600 p-1 rounded-lg transition"
                  title={`Usuń pałąk ${palek.numer}`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              )}
            </div>

            {/* Miejsce A */}
            <SlotRow
              slotKey="A"
              palekNumer={palek.numer}
              slot={palek.slots?.A}
              canEdit={canEdit}
              highlight={highlight}
              onAssign={() => onAssign("A", palek.slots?.A)}
              onSwap={() => onSwap("A")}
              onRefresh={() => palek.slots?.A?.km && onRefreshProduct(palek.slots.A.km)}
            />

            {/* Miejsce B */}
            <div className="mt-2.5">
              <SlotRow
                slotKey="B"
                palekNumer={palek.numer}
                slot={palek.slots?.B}
                canEdit={canEdit}
                highlight={highlight}
                onAssign={() => onAssign("B", palek.slots?.B)}
                onSwap={() => onSwap("B")}
                onRefresh={() => palek.slots?.B?.km && onRefreshProduct(palek.slots.B.km)}
              />
            </div>
          </div>
        </div>
      );
    }

    // Komponent Pojedynczego Miejsca na Pałąku
    function SlotRow({ slotKey, palekNumer, slot, canEdit, highlight, onAssign, onSwap, onRefresh }) {
      const isOccupied = !!slot?.km;
      const placeTag = `${palekNumer}${slotKey}`;
      const isHighlight = highlight && (highlight === placeTag || (isOccupied && (slot.km === highlight || slot.ean === highlight)));

      return (
        <div className={`p-2.5 rounded-xl border transition flex flex-col gap-1.5 ${
          isHighlight ? "bg-emerald-50 border-emerald-500 shadow-sm ring-1 ring-emerald-500" :
          isOccupied ? "bg-slate-50 border-slate-200" : "bg-white border-dashed border-slate-200"
        }`}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className={`w-6 h-6 rounded-md flex items-center justify-center text-xs font-black text-white shrink-0 ${
                slotKey === "A" ? "bg-emerald-600" : "bg-sky-600"
              }`}>
                {slotKey}
              </span>

              <div className="min-w-0">
                {isOccupied ? (
                  <>
                    <div className="flex items-center gap-2">
                      <span className="font-mono text-xs font-black text-slate-800">{slot.km}</span>
                      <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded">
                        {placeTag}
                      </span>
                    </div>
                    {slot.nazwa && (
                      <span className="text-[11px] text-slate-700 font-medium truncate block max-w-[200px]">{slot.nazwa}</span>
                    )}
                  </>
                ) : (
                  <span className="text-xs font-medium text-slate-400">PUSTE ({placeTag})</span>
                )}
              </div>
            </div>

            {canEdit && (
              <div className="flex items-center gap-1 shrink-0 ml-2">
                {isOccupied ? (
                  <>
                    <button
                      onClick={onRefresh}
                      className="p-1 text-slate-400 hover:text-emerald-700 rounded transition"
                      title="Odśwież dane produktu"
                    >
                      🔄
                    </button>
                    <button
                      onClick={onSwap}
                      className="p-1 text-slate-400 hover:text-emerald-700 rounded transition"
                      title={`Przenieś lub zamień ${placeTag}`}
                    >
                      ⇄
                    </button>
                    <button
                      onClick={onAssign}
                      className="p-1 text-slate-400 hover:text-sky-600 rounded transition"
                      title={`Edytuj dywan ${placeTag}`}
                    >
                      ✎
                    </button>
                  </>
                ) : (
                  <button
                    onClick={onAssign}
                    className="text-[11px] font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-lg transition"
                  >
                    + Dodaj
                  </button>
                )}
              </div>
            )}
          </div>

          {/* Rozszerzone dane: Cena, Rozmiar, EAN */}
          {isOccupied && (
            <div className="flex items-center gap-2 text-[10px] text-slate-500 pt-1 border-t border-slate-100">
              {slot.cena !== null && slot.cena !== undefined && (
                <span className="font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">
                  {slot.cena} zł
                </span>
              )}
              {slot.rozmiar && (
                <span>{slot.rozmiar}</span>
              )}
              {slot.ean && (
                <span className="text-slate-400">EAN: {slot.ean}</span>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
